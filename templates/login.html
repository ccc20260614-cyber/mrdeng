<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mrdeng.site</title>
<style>
:root{--bg:#0a0d14;--bg2:#111620;--border:#1e2530;--text:#d1d5db;--text2:#6b7280;--blue:#3b82f6;--blue-bg:rgba(59,130,246,.1);--red:#ef4444;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px 28px;width:100%;max-width:360px;margin:16px}
.login-box h1{font-size:1.3rem;margin-bottom:4px;text-align:center}
.login-box .sub{font-size:.78rem;color:var(--text2);text-align:center;margin-bottom:20px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-size:.9rem;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--blue)}
.login-box button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);padding:10px;font-size:.9rem;font-weight:600;cursor:pointer}
.login-box button:hover{opacity:.9}
.login-box .error{color:var(--red);font-size:.75rem;text-align:center;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="login-box">
<h1>mrdeng.site</h1>
<div class="sub">控制台登录</div>
<input type="password" id="pw" placeholder="输入密码" autofocus>
<button onclick="login()">登 录</button>
<div class="error" id="err">密码错误</div>
</div>
<script>
async function login(){
  const pw=document.getElementById('pw').value;
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(d.status==='ok'){location.href='/'}
    else{document.getElementById('err').style.display='block'}
  }catch(e){document.getElementById('err').style.display='block'}
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
